name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Weekly, so a break from a dependency, a PHP point release or a server image shows up on a Monday rather than
  # inside someone's pull request.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.5 is the floor: the sources use asymmetric visibility and typed class constants of 8.4, and the platform
        # this library serves runs 8.5. Add newer versions as they ship.
        php: ['8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # PHPUnit's extensions (dom ... xmlwriter), this library's own (ctype, openssl), Composer's (curl, phar).
          # Kept narrow so a future dependency on an extension not declared fails here.
          extensions: none, ctype, dom, filter, json, libxml, mbstring, openssl, tokenizer, xml, xmlwriter, curl, phar

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      # No composer.lock (a library), so this resolves fresh every run. There is no --prefer-lowest leg: `require`
      # is PHP and two extensions, so the floor of every range would install PHPUnit and prove nothing.
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint sources
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Unit tests
        run: vendor/bin/phpunit --testdox

  conformance:
    name: Conformance (Dovecot, GreenMail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Starts both servers from tests/Conformance/compose.yaml (images pinned by digest), runs the suite, stops them.
      - name: Conformance suite
        run: tests/Conformance/run.sh --testdox

  zero-dependency:
    name: Zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # The README promises no dependencies; assert it rather than trust it.
      - name: Install runtime dependencies only
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress

      # Plain text, not --format=json: with nothing installed `composer show` prints nothing to stdout, so empty here
      # really means empty, and a renamed JSON key cannot make it pass for the wrong reason.
      - name: Assert nothing was installed
        run: |
          installed=$(composer show --no-dev 2>/dev/null)
          if [ -n "$installed" ]; then
            echo "::error::coolms/imap claims zero runtime dependencies, but these were installed:"
            echo "$installed"
            exit 1
          fi
          echo "confirmed: zero runtime dependencies"

  static:
    name: PHPStan (level 8) and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: phpstan:2.2.13, php-cs-fixer:3.95.24

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: phpstan analyse --no-progress --memory-limit=1G

      # A dry run: the check reports the drift and fails; it never rewrites a file.
      - name: Code style
        run: php-cs-fixer fix --dry-run --diff
